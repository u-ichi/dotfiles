set -s escape-time 0

# 新規 window / pane の標準シェル
set -g default-shell /opt/homebrew/bin/fish

# ターミナル識別と truecolor / 拡張機能
# Claude Code / Codex CLI を tmux 越しに使う際の前提設定
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm*:RGB'
set -as terminal-features ',xterm*:clipboard'
set -as terminal-features ',xterm*:extkeys'

# 拡張キー有効化（Shift+Enter を内側の Claude/Codex に届ける）
set -s extended-keys on

# OSC52 で outer terminal (Ghostty 等) の clipboard に流す
set -s set-clipboard external

# Claude の desktop 通知・progress bar を outer terminal に通す
# 未設定だと tmux 内の Claude からの通知が全部捨てられる
set -g allow-passthrough on

# 端末のフォーカスイン/アウト event を pane 内に流す
# Claude Code の focus tracking (席を外した判定) や Neovim の autoread 等が使う
set -g focus-events on

# OSC 8 hyperlink を tmux 越しに通す (Claude Code の file/PR リンク)
set -as terminal-features ',xterm*:hyperlinks'
# DEC 2026 synchronized output で Claude Code のちらつき軽減
set -as terminal-features ',xterm*:sync'

# AI TUI は input 欄付きの interactive program のため aggressive-resize は off
setw -g aggressive-resize off

# clear / 全画面再描画の直前内容を scrollback に送る (slash command 出力等の救済)
setw -g scroll-on-clear on
# pane 失敗時だけ残す (test/build 失敗の traceback をその場に温存)
setw -g remain-on-exit failed
# copy/view mode の scrollbar は pane 幅を 1 カラム変えて折り返し位置を崩すため無効化
setw -g pane-scrollbars off

# ペイン境界にタイトル表示（どの pane が Claude / Codex か常時可視化）
setw -g pane-border-status top
set -g pane-border-indicators off  # 線側での active 強調は不要 (タイトルバー反転で識別)
setw -g pane-border-lines single  # 細線 (元のデフォルト)
# @fixed_title が設定されていれば手動タイトルを表示する。
# 未設定なら AI wrapper が更新する @ai_base_title、最後に raw #{pane_title} を表示する。
# グローバルに空文字で初期化しておくことで、pane 個別に未設定でも
# "No Such Name" エラーが出ない状態にする
set -g @fixed_title ""
set -g @ai_base_title ""
set -g @agmsg_active_identity ""
set -g @agmsg_display_identity ""
set -g @agmsg_identity_source ""
set -g @agmsg_unread_count ""
set -g @agmsg_unread_summary ""
set -g @ai_app ""
set -g @ai_title_source ""
set -g @ai_title_updated_at ""
# 非 active pane は Claude が入力待ち (pane_title が ✳ で始まる) なら orange で強調、
# それ以外は従来通り薄灰。active pane は navy bg のまま。
setw -g pane-border-format "#{?#{==:#{@ai_sidebar},1},,#{?pane_active,#[bg=colour24#,fg=colour255#,bold] #{?#{==:#{@ai_display_index},},#{pane_index},#{@ai_display_index}} │ #{?#{==:#{@agmsg_display_identity},},,#{@agmsg_display_identity} │ }#{?#{==:#{@fixed_title},},#{?#{==:#{@ai_base_title},},#{pane_title},#{@ai_base_title}},#{@fixed_title}} ,#{?#{m:✳*,#{pane_title}},#[fg=colour214#,bold]▎ #{?#{==:#{@ai_display_index},},#{pane_index},#{@ai_display_index}} │ #{?#{==:#{@agmsg_display_identity},},,#{@agmsg_display_identity} │ }#{?#{==:#{@fixed_title},},#{?#{==:#{@ai_base_title},},#{pane_title},#{@ai_base_title}},#{@fixed_title}} ,#[fg=colour244]▎ #{?#{==:#{@ai_display_index},},#{pane_index},#{@ai_display_index}} │ #{?#{==:#{@agmsg_display_identity},},,#{@agmsg_display_identity} │ }#{?#{==:#{@fixed_title},},#{?#{==:#{@ai_base_title},},#{pane_title},#{@ai_base_title}},#{@fixed_title}} }}}"

# アクティビティ・ベル通知（完了通知と相性◎）
setw -g monitor-activity on
set -g visual-activity off
set -g activity-action other
set -g bell-action any

# ステータスライン
set -g status-left "#[fg=colour244] #S #[fg=colour240]│ #[default]"
# status-right: 案 D (Brutalist Vertical Bar) — 背景なし、縦棒区切り、時刻主役
set -g status-justify left  # デフォルト明示 (サーバーに残った right を解除)
set -g status-right "#[fg=colour244]#(TZ=UTC date -u +%%H:%%M) UTC #[fg=colour240] │ #[fg=colour255,bold]%H:%M JST #[fg=colour240,nobold] │ #[fg=colour244]%Y/%m/%d %a "
# Window 名の判定は rename-windows.sh (hook 経由) に委譲する。
# automatic-rename は pane_current_command (= p_comm) を使うが、Claude Code /
# Codex CLI はバイナリがバージョンディレクトリに置かれているためバージョン文字列
# が表示されてしまう。そこで automatic-rename を切って、hook から argv[0] ベースで
# rename するスクリプトを走らせる。
set -wg automatic-rename off
set-window-option -g window-status-format "#[fg=colour244] #I: #W "
set-window-option -g window-status-current-format "#[fg=colour255,bold] #I: #W #[default]"

# 実プロセスの argv[0] を見て window を rename する (~200ms / 全 window)。
# alert-activity は頻発しすぎるので入れない。必要なタイミングで手動リフレッシュする
# 場合は `prefix + R` (下のキーバインド) を叩く。
set -g @ai_sidebars_enabled 1
set-hook -g after-new-session[0]    "run-shell -b '~/.config/tmux/rename-windows.sh'"
set-hook -g after-new-session[1]    "if -F '#{==:#{@ai_sidebars_enabled},1}' 'run-shell -b \"~/.config/tmux/ensure-ai-sidebars.sh\"'"
set-hook -g client-attached[0]      "run-shell -b '~/.config/tmux/rename-windows.sh'"
set-hook -g client-attached[1]      "if -F '#{==:#{@ai_sidebars_enabled},1}' 'run-shell -b \"~/.config/tmux/ensure-ai-sidebars.sh\"'"
set-hook -g after-select-window[0]  "run-shell -b '~/.config/tmux/rename-windows.sh'"
set-hook -g after-new-window[0]     "run-shell -b '~/.config/tmux/rename-windows.sh'"
set-hook -g after-new-window[1]     "if -F '#{==:#{@ai_sidebars_enabled},1}' 'run-shell -b \"~/.config/tmux/ensure-ai-sidebars.sh\"'"
set-hook -g after-split-window[0]   "run-shell -b '~/.config/tmux/update-ai-display-indexes.sh'"
set-hook -g after-kill-pane[0]      "run-shell -b '~/.config/tmux/update-ai-display-indexes.sh'"
set-hook -g after-kill-pane[1]      "run-shell -b '~/.config/tmux/cleanup-ai-sidebars.sh'"
# シェルの正常 exit / Ctrl+D で pane が破棄される時は after-kill-pane が発火しない
# (kill-pane コマンド時のみ)。pane-exited も拾って orphan sidebar を掃除する。
# remain-on-exit failed と併用: 失敗 pane は残るので normal_count>=1 となり cleanup は no-op。
set-hook -g pane-exited[0]          "run-shell -b '~/.config/tmux/update-ai-display-indexes.sh'"
set-hook -g pane-exited[1]          "run-shell -b '~/.config/tmux/cleanup-ai-sidebars.sh'"
set-hook -gu after-select-window[1]
set-hook -gu client-resized
set-hook -g pane-focus-in        "run-shell -b '~/.config/tmux/rename-windows.sh'"
bind R run-shell -b '~/.config/tmux/rename-windows.sh'
# prefix + , で手動命名したら @manual_name=1 を立て、rename-windows.sh の
# 自動上書き対象から外す (ピン留め)。
bind , command-prompt -I "#{?#{==:#{@manual_name},1},#W,}" "rename-window -- '%%' ; set-window-option @manual_name 1"
# prefix + M-, でピン留め解除 → 自動命名に復帰し、即座に argv[0] 名へ戻す。
bind M-, set-window-option -u @manual_name \; run-shell -b '~/.config/tmux/rename-windows.sh'
set-window-option -g window-status-separator "#[fg=colour240]│#[default]"
setw -g window-status-activity-style none
setw -g window-status-bell-style fg=colour141
set -g status-fg white
set -g status-bg '#24243a'  # 非アクティブペインと同じ navy に揃えて統一感

# Prefix（Ghostty の ctrl+a を ctrl+s に移したので tmux は C-a を取り戻す）
set-option -g prefix C-a
# デフォルトのPrefix(C-b)を解除
unbind C-b

# View
# ステータスライン更新間隔(秒)
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 80

# ステータスラインの場所設定
set-option -g status-position top
set-option -g set-titles on

# ペイン境界線
set -g pane-active-border-style fg=colour240  # 非 active と同色に統一 (default だと緑に戻るため明示)
set -g pane-border-style fg=colour240  # 非 active は薄灰 (主張抑える)

# 非アクティブペインを dim (アクティブ: 真っ黒 / 非アクティブ: 指定 navy)
set -g window-active-style 'bg=#000000'
set -g window-style 'bg=#1f1e2d'
set -g window-status-current-style default  # 以前の bg=white,fg=black を明示的に解除
set -g window-status-style default  # 非アクティブ window の既存 bg を解除

# マウス設定
set-option -g mouse on
# AI sidebar をクリックした場合は該当 pane へ移動し、それ以外は tmux 標準の mouse 動作を維持
bind-key -T root MouseDown1Pane if-shell 'test "$(tmux show-options -p -t "#{mouse_pane}" -v @ai_sidebar 2>/dev/null)" = 1' "run-shell -b '~/.config/tmux/ai-sidebar-click.sh \"#{mouse_pane}\" \"#{mouse_line}\" \"#{mouse_y}\"'" "select-pane -t = \; send-keys -M"
# マウスホイールで copy-mode に入る瞬間もカーソルを行頭へ寄せる (突入直後の ■ 右端被りを防ぐ)。
# 条件式は tmux デフォルトの WheelUpPane と同じ: alternate screen / 既に mode 中 /
# mouse 報告アプリでは従来どおりアプリへ委譲する (send-keys -M)。
bind-key -T root WheelUpPane if-shell -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -e ; send-keys -X start-of-line }

# ウィンドウ等の番号基準値
set-option -g base-index 1
# pane 番号も 1 始まり (base-index と統一)
setw -g pane-base-index 1
# window close 時に番号を詰める (一時 window の開閉で番号飛びを防ぐ)
set -g renumber-windows on

# バックスクロール行数を増やす（AI CLI の長い出力対応）
set -g history-limit 100000

# KeyBindings
# Codex TUI だけ Shift+Enter を改行 (Ctrl+J) として送る。
# Codex wrapper が pane-local option @ai_input_app=codex を立てるため、pane title には依存しない。
bind-key -n S-Enter if -F '#{==:#{@ai_input_app},codex}' 'send-keys C-j' 'send-keys S-Enter'

# 直前のウィンドウ
bind C-q last-window
# 設定リロード
bind r source-file ~/.config/tmux/tmux.conf
# ウィンドウ選択画面
bind Space choose-window
# 新ウィンドウ作成 (現在 pane の cwd を引き継ぐ。直後に左右分割して 2 ペイン状態にする)
bind c new-window -c "#{pane_current_path}" \; split-window -h -c "#{pane_current_path}"
# 分割していたペインそれぞれをWindowに
bind b break-pane
# ペインの縦分割 (現在 pane の cwd を引き継ぐ)
bind h split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
# ペインの横分割 (現在 pane の cwd を引き継ぐ)
bind v split-window -h -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind -r S-h resize-pane -L 6
bind -r S-l resize-pane -R 6
bind -r S-j resize-pane -D 6
bind -r S-k resize-pane -U 6
bind -r s swap-pane -U

# ペイン終了
bind = kill-pane
# 終了系をアンバインド(誤動作防止用)
unbind C-k
unbind C-K
# ペイン番号表示
bind i display-panes
# コピーモード突入
bind y copy-mode
# ペースト
bind p paste-buffer

# AI CLI ペイン一覧 popup (現 session のみ、選択で該当 pane にジャンプ)
# fish function ai-panes を呼ぶ。fzf を使うので fzf 必須
bind g display-popup -E -w 80% -h 60% 'fish -c ai-panes'
# AI CLI ペイン一覧 sidebar が無い window の左端に作成する
bind G run-shell -b '~/.config/tmux/ensure-ai-sidebars.sh'

# Pane title の固定上書き (@fixed_title を pane-level option で持つ)
# prefix + t: 現 pane の固定 title を入力 (Claude の OSC 更新に負けない)
# prefix + T: 固定を解除して AI wrapper / pane_title の表示に戻す
# (解除は unset ではなく empty-set。1 度も設定してない pane で
#  unset すると "No Such Name" が出るため)
bind t command-prompt -p "fixed title:" "set-option -p @fixed_title '%%'"
bind T set-option -p @fixed_title ""

# マウスバインドは tmux の border event が最上段 pane で発火しない制約
# (status-position top + pane-border-status top の組み合わせで row 0 が
#  status bar 領域になるため) により諦めた。キーバインド (prefix + t / T) のみ使用

# Use vim keybindings in copy mode
setw -g mode-keys vi

# マウスホイールでの scrollback スクロール量を 1 ノッチ 1 行に下げる
# (tmux デフォルトは 5 行で、連続イベントと掛け合わさって過去ログが一気に飛ぶ)。
# さらに start-of-line でカーソル列を行頭へ寄せる: classic renderer の Claude Code は
# copy-mode 突入時のカーソルが行末 (右端) に来て ■ が本文に被り読みづらいため、
# Codex と同じく左端固定にする。-N の数値は好みで調整する。
bind-key -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 1 scroll-up   \; send-keys -X start-of-line
bind-key -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down \; send-keys -X start-of-line

# コピー設定（pane 端での soft wrap 改行を除去して macOS clipboard へ送る）
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel -C -P "~/.config/tmux/copy-reflow-to-pbcopy.py #{pane_width}"
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel -C -P "~/.config/tmux/copy-reflow-to-pbcopy.py #{pane_width}"

# マウス操作のコピーも同じ reflow を通す。tmux デフォルトの MouseDragEnd / DoubleClick /
# TripleClick / C-j は素の copy-pipe-and-cancel のままなので、ドラッグ範囲選択で
# soft wrap 改行が clipboard に残ってしまう（キーボード y / Enter だけ直しても再発する）。
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel -C -P "~/.config/tmux/copy-reflow-to-pbcopy.py #{pane_width}"
bind-key -T copy-mode-vi C-j send-keys -X copy-pipe-and-cancel -C -P "~/.config/tmux/copy-reflow-to-pbcopy.py #{pane_width}"
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel -C -P "~/.config/tmux/copy-reflow-to-pbcopy.py #{pane_width}"
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel -C -P "~/.config/tmux/copy-reflow-to-pbcopy.py #{pane_width}"
