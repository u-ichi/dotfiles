set -s escape-time 0

# ターミナル識別と truecolor / 拡張機能
# Claude Code / Codex CLI を tmux 越しに使う際の前提設定
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm*:RGB'
set -as terminal-features ',xterm*:clipboard'
set -as terminal-features ',xterm*:extkeys'

# 拡張キー有効化（Shift+Enter を内側の Claude/Codex に届ける）
set -s extended-keys on

# OSC52 で outer terminal (Ghostty 等) の clipboard に流す
set -s set-clipboard external

# Claude の desktop 通知・progress bar を outer terminal に通す
# 未設定だと tmux 内の Claude からの通知が全部捨てられる
set -g allow-passthrough on

# AI TUI は input 欄付きの interactive program のため aggressive-resize は off
setw -g aggressive-resize off

# ペイン境界にタイトル表示（どの pane が Claude / Codex か常時可視化）
setw -g pane-border-status top
setw -g pane-border-format '#{pane_index} #{pane_title}'

# アクティビティ・ベル通知（完了通知と相性◎）
setw -g monitor-activity on
set -g visual-activity on
set -g activity-action other
set -g bell-action any

# ステータスライン
set -g status-left "#[fg=colour247,bg=colour232]#S > #[default]"
set -g status-right "#[fg=colour247,bg=colour232]UTC #(TZ=UTC date -u +%%H:%%M) < #[fg=colour255,bg=colour232]JST #(date +'%H:%M') < #(date +'%Y/%m/%d')"
set-window-option -g window-status-format " #I: #W "
set-window-option -g window-status-current-format "#[fg=colour255,bg=colour24,bold] #I: #W #[default]"
set -g status-fg white
set -g status-bg black

# Prefix（Ghostty が ctrl+a を使うため C-s に変更）
set-option -g prefix C-s
# デフォルトのPrefix(C-b)を解除
unbind C-b

# View
# ステータスライン更新間隔(秒)
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 50

# ステータスラインの場所設定
set-option -g status-position top
set-option -g set-titles on

# ペイン境界線
set -g pane-active-border-style fg=blue,bg=black
set -g pane-border-style fg=white
set -g window-status-current-style bg=white,fg=black

# マウス設定
set-option -g mouse on

# ウィンドウ等の番号基準値
set-option -g base-index 1

# バックスクロール行数を増やす（AI CLI の長い出力対応）
set -g history-limit 100000

# KeyBindings
# 直前のウィンドウ
bind C-q last-window
# 設定リロード
bind r source-file ~/.config/tmux/tmux.conf
# ウィンドウ選択画面
bind Space choose-window
# 新ウィンドウ作成
bind c new-window
# 分割していたペインそれぞれをWindowに
bind b break-pane
# ペインの縦分割
bind h split-window -v
# ペインの横分割
bind v split-window -h
bind -r S-h resize-pane -L 6
bind -r S-l resize-pane -R 6
bind -r S-j resize-pane -D 6
bind -r S-k resize-pane -U 6
bind -r s swap-pane -U

# ペイン終了
bind = kill-pane
# 終了系をアンバインド(誤動作防止用)
unbind C-k
unbind C-K
# ペイン番号表示
bind i display-panes
# コピーモード突入
bind y copy-mode
# ペースト
bind p paste-buffer

# Use vim keybindings in copy mode
setw -g mode-keys vi

# コピー設定（macOS pbcopy 直接使用）
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
