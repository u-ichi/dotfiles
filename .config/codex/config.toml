# ====== BEGIN: managed by dotfiles — do not edit this block by hand ======
# Codex CLI グローバル設定
# 用途別 profile は ~/.claude/rules/codex-delegation.md を参照
# プロジェクト trust ([projects.*]) やプラグイン有効化 ([plugins.*]) は
# マシン依存のため本ブロック外に Codex が自動追記する

model = "gpt-5.4"
model_reasoning_effort = "medium"
review_model = "gpt-5.3-codex"
tool_output_token_limit = 25000
model_auto_compact_token_limit = 128000

# 軽量レビュー・要約・diff 点検（速度優先、枠消費少）
[profiles.routine]
model = "gpt-5.4-mini"
model_reasoning_effort = "low"
approval_policy = "never"
sandbox_mode = "read-only"

# コードレビュー専用（セキュリティ / OWASP / PR レビュー）
[profiles.review]
model = "gpt-5.3-codex"
model_reasoning_effort = "medium"
approval_policy = "never"
sandbox_mode = "read-only"

# 深い調査・原因究明・設計判断・Deep Research 並列
[profiles.research]
model = "gpt-5.4"
model_reasoning_effort = "high"
approval_policy = "never"
sandbox_mode = "read-only"
tool_output_token_limit = 40000

# 書き込みを伴う実装委譲
[profiles.patch]
model = "gpt-5.4"
model_reasoning_effort = "medium"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
# ====== END: managed by dotfiles ======
