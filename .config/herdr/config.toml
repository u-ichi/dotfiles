# herdr 設定 (default は `herdr --default-config` で確認可能)
# 現行 tmux (.config/tmux/tmux.conf) の操作感を再現する。
# 変更したい項目だけをここに書く。default と一致する項目はコメントアウトのまま残さない。

[keys]
# prefix を tmux と揃える
prefix = "ctrl+a"

# tmux prefix+r → reload。default では prefix+r が resize_mode なので resize は Shift+R に逃す
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

# tmux prefix+h → 上下分割、prefix+v → 左右分割
# herdr の split_horizontal / split_vertical は「分割線」ベースの命名 (推定):
#   split_horizontal = 水平の分割線 = 上下分割
#   split_vertical   = 垂直の分割線 = 左右分割
# 起動後に上下と左右が逆なら本ファイルで h と v の割当をスワップする
split_horizontal = "prefix+h"
split_vertical = "prefix+v"

# tmux prefix+- → kill pane。herdr は `=` の key 名を持たないので minus に統一
close_pane = "prefix+minus"

# tmux prefix+space → choose-window (herdr の tab picker)
goto = "prefix+space"

# tmux prefix+y → copy-mode (herdr は scrollback を editor で開く挙動が近い)
edit_scrollback = "prefix+y"

# tmux 側の pane 移動 (Ctrl+Shift+矢印, direct binding, prefix なし) をそのまま再現。
# default の prefix+h/j/k/l は split_horizontal と衝突するので direct に振り替える。
focus_pane_left = "ctrl+shift+left"
focus_pane_down = "ctrl+shift+down"
focus_pane_up = "ctrl+shift+up"
focus_pane_right = "ctrl+shift+right"

# workspace (spaces) 切替。Chrome/エディタ的な操作感で Ctrl+Tab で下 (next),
# Ctrl+Shift+Tab で上 (previous)。default では両方 unset なので明示 bind。
# 前提: Ghostty 側で ctrl+tab=csi:9;5u / ctrl+shift+tab=csi:9;6u に上書き済みで、
# CSI-u 経由で herdr へ届く。届かない場合は Ghostty 側の keybind を見直す。
next_workspace = "ctrl+tab"
previous_workspace = "ctrl+shift+tab"

# Codex などの TUI が表示幅で入れた改行を、貼り付け前に clipboard 上で除去する。
# herdr でドラッグ選択した直後に prefix+Shift+Y を押してから貼り付ける。
[[keys.command]]
key = "prefix+shift+y"
type = "shell"
command = "python3 \"$HOME/.config/herdr/reflow_clipboard.py\""
description = "clipboard の表示折り返しを除去"

# 数字キーによる直接切替:
#   Ctrl+1..9      → tab 切替  (Ghostty 側で csi:<code>;5u を送出)
#   Cmd+1..9       → workspace 切替  (Ghostty 側で csi:<code>;7u = Ctrl+Alt+N を送出)
# tabs / workspaces は modifier だけ書く。値が "ctrl" なら ctrl+1..9 が tab 切替になる。
[keys.indexed]
tabs = "ctrl"
workspaces = "ctrl+alt"

[experimental]
# Claude Code TUI への画像貼付 (Cmd+V / Ctrl+V で clipboard の画像) を通すために有効化。
# default (false) だと Ghostty + herdr + Claude Code 環境で clipboard 画像を貼っても
# [Image #N] プレースホルダーが付かず無反応になる。名前は kitty_graphics だが
# 実体として image-paste passthrough を含む (herdr issue #195 / #205 参照)。
kitty_graphics = true
