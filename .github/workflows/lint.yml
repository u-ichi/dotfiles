name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          git ls-files -z '*.sh' | xargs -0 shellcheck -x

      - name: Fish syntax check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fish
          git ls-files -z '*.fish' | xargs -0 -I{} fish --no-execute {}

      - name: TOML check
        run: |
          curl -fsSL https://github.com/tamasfe/taplo/releases/latest/download/taplo-full-linux-x86_64.gz \
            | gunzip > /usr/local/bin/taplo
          chmod +x /usr/local/bin/taplo
          git ls-files -z '*.toml' | xargs -0 -I{} taplo check {}

      - name: JSON check
        run: |
          git ls-files -z '*.json' | xargs -0 -I{} python3 -m json.tool {} > /dev/null
