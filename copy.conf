# コピー定義: ソース(リポジトリ相対パス) → コピー先
# 空行・#始まりの行は無視される
# $HOME と $DOTFILES_DIR はシェル変数として展開される

# Fish Shell（個別ファイル単位でコピーし、自動生成ファイルの repo 混入を防ぐ）
.config/fish/config.fish                              : $HOME/.config/fish/config.fish
.config/fish/fish_plugins                             : $HOME/.config/fish/fish_plugins
.config/fish/completions                              : $HOME/.config/fish/completions
.config/fish/functions/claude.fish                    : $HOME/.config/fish/functions/claude.fish
.config/fish/functions/claude-worktree.fish           : $HOME/.config/fish/functions/claude-worktree.fish
.config/fish/functions/codex.fish                     : $HOME/.config/fish/functions/codex.fish
.config/fish/functions/codex-worktree.fish            : $HOME/.config/fish/functions/codex-worktree.fish
.config/fish/functions/x-search.fish                  : $HOME/.config/fish/functions/x-search.fish
.config/fish/functions/gcloud_sdk_argcomplete.fish    : $HOME/.config/fish/functions/gcloud_sdk_argcomplete.fish
.config/fish/functions/ai-panes.fish                  : $HOME/.config/fish/functions/ai-panes.fish
.config/fish/functions/ai-panes-sidebar.fish          : $HOME/.config/fish/functions/ai-panes-sidebar.fish
.config/fish/functions/__ai_pane_title_sync.fish      : $HOME/.config/fish/functions/__ai_pane_title_sync.fish
.config/fish/functions/cc-panes.fish                  : $HOME/.config/fish/functions/cc-panes.fish

# Git
.config/git/config     : $HOME/.gitconfig

# Node.js package managers
.config/npm/npmrc      : $HOME/.npmrc
.config/pnpm/rc        : $HOME/Library/Preferences/pnpm/rc

# Ghostty
.config/ghostty/config : $HOME/.config/ghostty/config

# Glow (markdown viewer)
.config/glow/glow.yml  : $HOME/Library/Preferences/glow/glow.yml

# Karabiner
.config/karabiner      : $HOME/.config/karabiner

# SSH
.config/ssh/config     : $HOME/.ssh/config

# tmux
.config/tmux/tmux.conf         : $HOME/.config/tmux/tmux.conf
.config/tmux/rename-windows.sh : $HOME/.config/tmux/rename-windows.sh
.config/tmux/ensure-ai-sidebars.sh : $HOME/.config/tmux/ensure-ai-sidebars.sh
.config/tmux/update-ai-display-indexes.sh : $HOME/.config/tmux/update-ai-display-indexes.sh
.config/tmux/cleanup-ai-sidebars.sh : $HOME/.config/tmux/cleanup-ai-sidebars.sh
.config/tmux/ai-sidebar-click.sh : $HOME/.config/tmux/ai-sidebar-click.sh

# Git hooks
hooks/pre-commit       : $DOTFILES_DIR/.git/hooks/pre-commit
